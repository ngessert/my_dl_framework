[tool.poetry]
name = "my_dl_framework"
version = "0.1.0"
description = "Deep Learning Framework"
authors = ["Nils Gessert <nils.gessert@gmail.com>"]
repository = "https://github.com/ngessert/my_dl_framework"
readme = "README.rst"
license = "MIT"
packages = [
    {include = "my_dl_framework"}
]

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.12"
tqdm = "^4.66.4"
torch = {version = "^2.3.0", source = "pytorch"}
lightning = "2.0.1"
torchvision = {version = "^0.18.0", source = "pytorch"}
pyyaml = "^6.0.1"
clearml = "^1.16.1"
plotly = "^5.22.0"
scikit-learn = "^1.4.2"
numpy = "^1.26.4"
pandas = "^2.2.2"
matplotlib = "^3.9.0"
pydicom = "^2.4.4"
typer = "^0.12.3"
pydantic = "1.10.11"
rich = "^13.7.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
pylint = "^3.2.2"
pytest-cov = "^4.0.0"
pre-commit = "^3.2.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
flake8-pyproject = "^1.2.3"
yapf = "^0.40.2"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.3.7"
sphinx-rtd-theme = "^2.0.0"

[tool.poetry.scripts]
mdlf = 'my_dl_framework.cli.main:cli'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
ignore = ['E501']
max-line-length = 160
exclude = ['doc']
count = true


[tool.pylint.'MESSAGES CONTROL']
max-line-length = 160
disable = "C0103"
ignore-paths = "doc, train_configs, ensemble_configs, tests"

[tool.isort]
profile = "pycharm"

[tool.yapf]
based_on_style = "pep8"
COLUMN_LIMIT = 160
