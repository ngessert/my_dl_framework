name: Python tests
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.12
        uses: actions/setup-python@v2
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with dev
      - name: Pylint
        run: poetry run pylint --fail-under=5.0 my_dl_framework
      - name: Test with pytest
        run: |
          export CLEARML_API_HOST="https://api.clear.ml"
          export CLEARML_WEB_HOST="https://app.clear.ml"
          export CLEARML_FILES_HOST="https://files.clear.ml"
          export CLEARML_API_ACCESS_KEY=${{ secrets.CLEARML_API_ACCESS_KEY }}
          export CLEARML_API_SECRET_KEY=${{ secrets.CLEARML_API_SECRET_KEY }}
          poetry run pytest --durations=0 --cov=. --cov-report xml:coverage.xml --junitxml=results.xml --verbose tests/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
