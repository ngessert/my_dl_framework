data:
  dataset_type: "RSNAChallengeBinary"
  cl_base_dataset_id: null
  csv_name: "stage_2_train_labels_test.csv"
  images_dir: "tests/test_data/rsna_binary/training_images"
  labels_dir: "tests/test_data/rsna_binary/training_labels"
  # ClearML dataset params
  new_dataset_name: "RSNA base dataset"
  dataset_project: "Unit Tests"
  dataset_output_uri: "tests/test_data/clearml_datasets"
  class_names: ["Class0", "Class1"]
  data_split_file: "tests/test_cv_splits/cv_split_3fold.json"
# Generated dataset ID
cl_dataset_id: 17565cfc135847ee9c4bf969e3cdbd26
base_path: tests/test_data/rsna_binary
# Training settings
run_cv_subset: [0, 1, 2]  # Specify a subset of CV splits to train
batch_size: 2
lr_scheduler: stepwise
step_size: 50
lr_step: 2
num_epochs: 1
optimizer: "Adam"
learning_rate: 0.00005
loss_name: cross_entropy
loss_log_freq: 1
num_batch_examples: 1
# Model settings
classification_model_name: squeezenet1_1  # "densenet121"
pretrained: True
num_classes: 2
preload_images: False
resize_images: 256
random_crop: 224
random_fliplr: True
random_flipud: False
color_jitter: [0.5, 0.5, 0.2, 0.2]  # brightness, contrast, saturation, hue
continue_training: null  # null or the timestamp
continue_training_from_clearml: null # null or clearml ID
ckpt_every_n_epochs: 1
# Inference
apply_center_crop_inf: True
multi_crop_eval: None  # e.g. 3->9 crops
# Validation settings:
validate_every_x_epochs: 1
validate_on_train_set: False
test_aug_ensemble_mode: mean
max_num_batches_val: 1
val_best_metric: auc_score_mean_validation
val_best_target: max
